name: Valera Android APK

on:
  push:
    branches:
      - valera-android-mvp
    paths:
      - "valera-android-mvp/**"
      - ".github/workflows/valera-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valera-android-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Russian offline wake-word model
        run: |
          rm -rf app/src/main/assets/model-ru
          mkdir -p app/src/main/assets/model-ru
          curl -L --fail --retry 3             -o /tmp/vosk-model-small-ru-0.22.zip             https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          rm -rf /tmp/vosk-ru
          mkdir -p /tmp/vosk-ru
          unzip -q /tmp/vosk-model-small-ru-0.22.zip -d /tmp/vosk-ru
          cp -R /tmp/vosk-ru/vosk-model-small-ru-0.22/. app/src/main/assets/model-ru/
          printf "valera-vosk-small-ru-0.22-v1" > app/src/main/assets/model-ru/uuid
          test -f app/src/main/assets/model-ru/conf/model.conf
          du -sh app/src/main/assets/model-ru

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: valera-1.0.4-apk
          path: valera-android-mvp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          archive: false
